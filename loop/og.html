<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Zen Maru Gothic', 'Noto Sans KR', sans-serif; color: #3a2340; position: relative;
    background: radial-gradient(60% 80% at 85% 20%, #e9dcff 0%, transparent 60%), radial-gradient(70% 90% at 10% 100%, #ffd3e4 0%, transparent 60%), #fff7fb;
  }
  .orbit { position: absolute; right: 70px; top: 85px; width: 460px; height: 460px; }
  .core { position: absolute; inset: 29%; border-radius: 50%; display: grid; place-content: center; text-align: center;
    background: radial-gradient(circle at 35% 30%, #fff, #ffe1ee 60%, #f1dcff); box-shadow: 0 30px 60px -30px rgba(255,107,157,.8); }
  .core b { display: block; font-size: 34px; line-height: 1.05; letter-spacing: .06em; background: linear-gradient(135deg,#ff6b9d,#a06cd5); -webkit-background-clip: text; color: transparent; }
  .core small { font-size: 12px; letter-spacing: .24em; color: #a58aa8; margin-top: 8px; display: block; }
  .ring { position: absolute; inset: 4%; border-radius: 50%; border: 2px dashed rgba(196,156,255,.5); }
  .sat { position: absolute; left: 50%; top: 50%; width: 78px; height: 78px; margin: -39px 0 0 -39px; border-radius: 50%;
    display: grid; place-items: center; color: #fff; font-size: 32px; box-shadow: 0 12px 24px -10px rgba(0,0,0,.25), inset 0 -5px 0 rgba(0,0,0,.08); }
  .copy { position: absolute; left: 80px; top: 120px; width: 600px; }
  .eyebrow { display: inline-block; font-size: 20px; letter-spacing: .2em; color: #c2457a; background: #fff; padding: 10px 20px; border-radius: 999px; box-shadow: 0 8px 20px -12px rgba(255,107,157,.7); }
  h1 { margin: 26px 0 0; font-size: 92px; line-height: 1.04; letter-spacing: -.03em; }
  h1 span { display: block; }
  h1 .g { background: linear-gradient(90deg,#ff6b9d,#a06cd5,#4a90d9); -webkit-background-clip: text; color: transparent; }
  p { margin: 22px 0 0; font-size: 28px; color: #c2457a; }
  .url { position: absolute; left: 80px; bottom: 50px; font-size: 20px; color: #8a6a90; letter-spacing: .04em; }
</style></head>
<body>
  <div class="copy">
    <span class="eyebrow">CUTIE STREET FAN HUB · KR ⇄ JP</span>
    <h1><span>귀여움으로</span><span class="g">세계까지</span></h1>
    <p>かわいいで、世界へ。</p>
  </div>
  <div class="orbit">
    <div class="ring"></div>
    <div class="core"><div><b>CUTIE</b><b>STREET</b><small>KAWAII LAB.</small></div></div>
  </div>
  <div class="url">custo-kr.vercel.app · 비공식 팬사이트</div>
  <script>
    const ms = [['里','#FFC93C'],['愛','#FF4757'],['可','#3CCFA8'],['彩','#4A90D9'],['笑','#FF9F43'],['み','#5DC8F5'],['凪','#A06CD5'],['遥','#FF6B9D']];
    const o = document.querySelector('.orbit');
    ms.forEach(([c, col], i) => { const s = document.createElement('div'); s.className = 'sat'; s.textContent = c; s.style.background = col;
      const a = (i / 8) * Math.PI * 2 - Math.PI / 2; s.style.transform = `translate(${Math.cos(a) * 190}px, ${Math.sin(a) * 190}px)`; o.appendChild(s); });
  </script>
</body></html>
