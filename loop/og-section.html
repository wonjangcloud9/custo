<!-- Section share card (1200x630). Rendered per page with Playwright → docs/public/og/sec-<page>.png; fill BG/EYEBROW/TITLE/TSIZE/SUB/EMOJI. -->
<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+KR:wght@700;900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Zen Maru Gothic', 'Noto Sans KR', sans-serif; color: #2f1a35; position: relative; background: BG; }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.35) 2px, transparent 2.5px); background-size: 34px 34px; }
  .card { position: absolute; left: 60px; top: 60px; right: 60px; bottom: 60px; border-radius: 48px; background: rgba(255,255,255,.9); box-shadow: 0 40px 80px -40px rgba(42,16,48,.55); overflow: hidden; }
  .eb { position: absolute; left: 70px; top: 64px; padding: 10px 22px; border-radius: 999px; font-size: 22px; letter-spacing: .24em; color: #a33366; box-shadow: inset 0 0 0 3px #f6d3e2; background: #fff; }
  h1 { position: absolute; left: 70px; top: 140px; margin: 0; font-size: TSIZE; line-height: 1.05; font-weight: 900; letter-spacing: -.01em;
    background: linear-gradient(100deg, #2f1a35 25%, #a33366 70%, #6b3fa0); -webkit-background-clip: text; color: transparent; }
  .sub { position: absolute; left: 72px; top: 330px; width: 640px; font-size: 32px; line-height: 1.45; color: #5a4060; }
  .stk { position: absolute; right: 80px; top: 120px; width: 260px; height: 260px; border-radius: 76px; background: #fff; display: grid; place-items: center; font-size: 150px; transform: rotate(8deg);
    box-shadow: 0 30px 60px -30px rgba(42,16,48,.5), inset 0 0 0 4px #f6d3e2; }
  .beads { position: absolute; left: 72px; bottom: 70px; display: flex; gap: 12px; }
  .beads i { width: 22px; height: 22px; border-radius: 50%; }
  .foot { position: absolute; right: 70px; bottom: 62px; font-size: 24px; color: #6a4f70; letter-spacing: .06em; }
</style></head><body>
<div class="grain"></div>
<div class="card">
  <div class="eb">EYEBROW</div>
  <h1>TITLE</h1>
  <div class="sub">SUB</div>
  <div class="stk">EMOJI</div>
  <div class="beads"><i style="background:#FFC93C"></i><i style="background:#FF4757"></i><i style="background:#3CCFA8"></i><i style="background:#4A90D9"></i><i style="background:#FF9F43"></i><i style="background:#5DC8F5"></i><i style="background:#A06CD5"></i><i style="background:#FF6B9D"></i></div>
  <div class="foot">Custo · CUTIE STREET 비공식 팬허브</div>
</div>
<script>
// shrink the title until it clears the sticker, then hang the subtitle under it
document.fonts.ready.then(() => {
  const h = document.querySelector('h1'), sub = document.querySelector('.sub'), card = document.querySelector('.card')
  const limit = document.querySelector('.stk').getBoundingClientRect().left - 40
  let fs = parseFloat(getComputedStyle(h).fontSize)
  while (h.getBoundingClientRect().right > limit && fs > 60) { fs -= 2; h.style.fontSize = fs + 'px' }
  sub.style.top = (h.getBoundingClientRect().bottom - card.getBoundingClientRect().top + 22) + 'px'
})
</script>
</body></html>
