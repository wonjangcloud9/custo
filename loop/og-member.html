<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Zen Maru Gothic', 'Noto Sans KR', sans-serif; color: #fff; position: relative;
    background: radial-gradient(70% 90% at 10% 0%, color-mix(in srgb, MC 55%, white), transparent 60%), linear-gradient(135deg, color-mix(in srgb, MC 78%, #2a1030), color-mix(in srgb, MC 45%, #2a1030)); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.16) 2px, transparent 2.5px); background-size: 34px 34px; }
  .tile { position: absolute; right: 90px; top: 115px; width: 400px; height: 400px; border-radius: 96px; background: #fff; display: grid; place-items: center; transform: rotate(6deg);
    box-shadow: 0 50px 90px -40px rgba(42,16,48,.7); }
  .tile b { font-size: 270px; line-height: 1; color: color-mix(in srgb, MC 60%, #2a1030); font-weight: 900; }
  .tile i { position: absolute; right: -26px; top: -26px; width: 96px; height: 96px; border-radius: 50%; background: MC; border: 8px solid #fff; display: grid; place-items: center; font-style: normal; font-size: 46px; }
  .txt { position: absolute; left: 80px; top: 92px; width: 620px; }
  .eb { font-size: 24px; letter-spacing: .26em; opacity: .92; }
  .kana { margin-top: 26px; font-size: 30px; letter-spacing: .3em; opacity: .9; }
  h1 { margin: 4px 0 0; font-size: 128px; line-height: 1.05; font-weight: 900; letter-spacing: .02em; text-shadow: 0 8px 30px rgba(42,16,48,.3); }
  .ko { margin-top: 14px; font-size: 40px; }
  .ko small { font-size: 28px; opacity: .85; margin-left: 10px; }
  .chips { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chips span { padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.95); color: color-mix(in srgb, MC 55%, #2a1030); font-size: 25px; }
  .foot { position: absolute; left: 80px; bottom: 44px; font-size: 24px; letter-spacing: .08em; opacity: .9; }
</style></head><body>
<div class="dots"></div>
<div class="txt">
  <div class="eb">CUTIE STREET · MEMBER NO / 08</div>
  <div class="kana">KANA</div>
  <h1>JA</h1>
  <div class="ko">KO<small>· EN</small></div>
  <div class="chips"><span>EMOJI COLORNAME</span><span>🎂 BDAY</span><span>📍 PLACE</span></div>
</div>
<div class="tile"><b>KANJI</b><i>EMOJI</i></div>
<div class="foot">Custo — 귀여움으로 세계까지 · 비공식 팬허브</div>
</body></html>
