name: GitHub Pages pointer

# The site itself is built and served by Vercel (https://custo-kr.vercel.app) on every push to main.
# GitHub Pages only keeps a small page that forwards old /custo/… links there; this republishes it
# when that page changes.
on:
  push:
    branches: [main]
    paths:
      - 'gh-pages-redirect/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-redirect
